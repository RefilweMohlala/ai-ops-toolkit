services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ops
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 10s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ops
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      WEBHOOK_URL: http://localhost:5678/
      N8N_PUBLIC_URL: http://localhost:5678
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK}
      PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK}
      REVIEW_LINK_SECRET: ${REVIEW_LINK_SECRET}
      REVIEWER_EMAIL: ${REVIEWER_EMAIL}
      ALERT_EMAIL: ${ALERT_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  n8n_data: